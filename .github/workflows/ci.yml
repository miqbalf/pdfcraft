name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions. Nightly fuzzing is in fuzz.yml.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so that adding `full-ci` to an open PR starts a run with Windows in it.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# The token is only used to check out the code: no job writes to the repository.
permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end. Adding
# any label but `full-ci` gets a group of its own, so it neither runs the gate nor cancels a run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shared gate doesn't check where git dependencies come from; release.yml runs the same job.
  # This fork also pins miqbalf/craft-libs, and the shared check takes one allowed prefix. So the
  # shared check runs with github.com/ (it still checks Cargo.lock, Cargo config overrides and
  # `cargo metadata --locked`), and the next step narrows the owners to storytold and miqbalf.
  git-sources:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    name: Git dependencies come from storytold or miqbalf
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
      - uses: storytold/craft-common-actions/actions/check-git-sources@main
        with:
          allowed-prefix: "git+https://github.com/"
      - name: Git dependencies come from storytold or miqbalf
        run: |
          outside=$(grep -E '^source = "git\+' Cargo.lock | grep -vE '^source = "git\+https://github\.com/(storytold|miqbalf)/' | sort -u || true)
          if [ -n "$outside" ]; then
            while IFS= read -r line; do echo "::error::git dependency outside storytold and miqbalf: $line"; done <<<"$outside"
            exit 1
          fi
          echo "Git dependencies all come from github.com/storytold or github.com/miqbalf"

  gate:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Windows on main, manual runs and pull requests labelled `full-ci`. No macOS on PRs or main:
      # the org's 5 macOS slots are kept for release builds, and release.yml builds macOS.
      os: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]' }}
      # Same craft-fonts commit as release.yml and freebsd.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # egui/winit/rfd, and the independent oracles (crates/oracle).
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      # cargo-deny for the deny step of `cargo xtask ci`, which requires it under CI.
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # A missing oracle fails the job instead of printing a skip notice that reads as a pass.
      linux-env: PDFCRAFT_ORACLES_REQUIRED=1
      windows-env: PDFCRAFT_REQUIRE_WINRES=1
      # Windows completed its 54m33s gate, then cache save hit the default 60m job cap
      # (run 44364342368). Leave bounded room for setup and post-job cleanup.
      # This changes no test watchdog or selection; craft-common-actions#60.
      timeout-minutes: 90
      # Preserve the packaging regression check removed from git-sources in #7042.
      command: |
        pwsh -NoProfile -File packaging/windows/test-font-notices.ps1
        cargo xtask ci
      # Windows checks what differs by platform: the build (with resources) and the tests.
      windows-command: |
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
