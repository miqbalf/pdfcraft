[package]
name = "pdfcraft-cli"
description = "PdfCraft command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pdfcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pdfcraft-render = { workspace = true }
serde_json = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-audit = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-preflight = { workspace = true }
pdfcraft-automation = { workspace = true }
pdfcraft-platform = { workspace = true }
base64 = "0.23"
# seal-worker. All already in Cargo.lock: httparse 1.10.1 (through hyper and ureq-proto), ureq
# 3.5.0 (craft-update, with these features), hmac 0.13.0, sha2 0.11.1, zeroize and chrono (pdfcraft-sign);
# licences MIT or MIT OR Apache-2.0 (rule 26).
pdfcraft-sign = { workspace = true }
chrono = { workspace = true }
zeroize = { workspace = true }
httparse = "1.10"
hmac = "0.13"
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }

[dev-dependencies]
# Decodes `render` output in tests/it/owner_password.rs.
craft-image-codecs = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for pdfcraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`pdfcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["pdfcraft-automation/mcp"]
